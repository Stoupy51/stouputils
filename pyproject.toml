
[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project]
name = "stouputils"
version = "26.12.1"
description = "Stouputils is a collection of utility modules designed to simplify and enhance the development process. It includes a range of tools for tasks such as execution of doctests, display utilities, decorators, as well as context managers, and many more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["utilities", "tools", "helpers", "development", "typed", "pyright", "python"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "tqdm>=4.70.1",
    "requests>=2.34.2",
    "msgspec[toml,yaml]>=0.22.0",
    "pillow>=13.0.0",
    "python-box>=8.0.0",
    "argcomplete>=3.7.2",
    "psutil>=7.2.2",
    "redis[hiredis]>=8.1.0",
    "setproctitle>=1.3.8",
    "numpy>=2.5.4",
]
authors = [
    { name = "Stoupy51", email = "stoupy51@gmail.com" },
]

[project.optional-dependencies]
docs = [
    "mypy>=2.4.1",
    "myst_parser>=5.1.0",
    "sphinx>=9.1.1",
    "sphinx_copybutton>=0.5.2",
    "sphinx_design>=0.7.0",
    "sphinx_treeview>=1.1.1",
    "sphinx_breeze_theme>=0.13.2",
    "pydata_sphinx_theme>=0.24.0",
    "zensical>=0.1.0",
    "mkdocstrings-python>=2.0.10",
]
data_science = [
    "opencv-python>=5.0.0.93",
    "scikit-image>=0.26.0",
    "simpleitk>=2.5.7",
    "mlflow>=3.18.0",
    "scikit-learn>=1.9.1",
    "PyWavelets>=1.10.0",
]
optional = [
    "mlflow>=3.18.0",
    "polars>=2.1.0",
    "mypy>=2.4.1",
    "uv>=0.13.7"
]
all = [
    "mypy>=2.4.1",
    "myst_parser>=5.1.0",
    "sphinx>=9.1.1",
    "sphinx_copybutton>=0.5.2",
    "sphinx_design>=0.7.0",
    "sphinx_treeview>=1.1.1",
    "sphinx_breeze_theme>=0.13.2",
    "pydata_sphinx_theme>=0.24.0",
    "zensical>=0.1.0",
    "mkdocstrings-python>=2.0.10",
    "opencv-python>=5.0.0.93",
    "scikit-image>=0.26.0",
    "simpleitk>=2.5.7",
    "mlflow>=3.18.0",
    "scikit-learn>=1.9.1",
    "PyWavelets>=1.10.0",
    "mlflow>=3.18.0",
    "polars>=2.1.0",
    "mypy>=2.4.1",
    "uv>=0.13.7"
]

[project.urls]
Homepage = "https://stoupy51.github.io/stouputils"
Issues = "https://github.com/Stoupy51/stouputils/issues"
Repository = "https://github.com/Stoupy51/stouputils"

[project.scripts]
stouputils = "stouputils.__main__:main"

# Makes the VS Code palettes resolvable by name from any pygments consumer, not just the Sphinx generator
[project.entry-points."pygments.styles"]
vscode-dark-plus = "stouputils.applications.automatic_docs.sphinx.highlighting.styles:VSCodeDarkPlusStyle"
vscode-light-plus = "stouputils.applications.automatic_docs.sphinx.highlighting.styles:VSCodeLightPlusStyle"

[dependency-groups]
dev = [
    "ipykernel",
    "nbclient",
    "nbformat",
    "pyrefly",
    "pyright",
    "pytest",
    "ruff",
    "uv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.pyright]
typeCheckingMode = "strict"

[tool.pyrefly]
permissive-ignores = true

[tool.complexipy]
paths = ["."]
max-complexity-allowed = 15
sort = "desc"

[tool.ruff]
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "*.pyi",
]
line-length = 135

# Positional-only or literal-building calls, where the boolean has no keyword to take
[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["os.set_inheritable", "polars.lit"]

[tool.ruff.lint.isort]
# Keeps the "name as name" re-exports of a package grouped in a single statement
combine-as-imports = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "T20",
    "RUF",
    "RET",
    "SIM",
    "PIE",
    "PERF401",
    "PGH003",
    "FBT003",
    "TRY203",
    "S110",
    "PLR5501",
]
ignore = [
    "T201",
    "W191",
    "N803",
    "N806",
]

[tool.stouputils.check]
ignore = ["long-docstring"]

