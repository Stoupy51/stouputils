
[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project]
name = "stouputils"
version = "26.0.3"
description = "Stouputils is a collection of utility modules designed to simplify and enhance the development process. It includes a range of tools for tasks such as execution of doctests, display utilities, decorators, as well as context managers, and many more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["utilities", "tools", "helpers", "development", "typed", "pyright", "python"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "tqdm>=4.0.0",
    "requests>=2.20.0",
    "msgspec[toml,yaml]>=0.20.0",
    "pillow>=12.0.0",
    "python-box>=7.0.0",
    "argcomplete>=3.0.0",
    "psutil>=7.2.2",
    "redis[hiredis]",
    "setproctitle",
    "numpy",
]
authors = [
    { name = "Stoupy51", email = "stoupy51@gmail.com" },
]

[project.optional-dependencies]
docs = [
    "mypy",
    "myst_parser",
    "sphinx",
    "sphinx_copybutton",
    "sphinx_design",
    "sphinx_treeview",
    "sphinx_breeze_theme",
    "pydata_sphinx_theme",
    "zensical",
    "mkdocstrings-python",
]
data_science = [
    "opencv-python",
    "scikit-image",
    "simpleitk",
    "mlflow",
    "scikit-learn",
    "PyWavelets",
]
optional = [
    "mlflow",
    "polars",
    "mypy",
    "uv"
]
all = [
    "mypy",
    "myst_parser",
    "sphinx",
    "sphinx_copybutton",
    "sphinx_design",
    "sphinx_treeview",
    "sphinx_breeze_theme",
    "pydata_sphinx_theme",
    "zensical",
    "mkdocstrings-python",
    "opencv-python",
    "scikit-image",
    "simpleitk",
    "mlflow",
    "scikit-learn",
    "PyWavelets",
    "mlflow",
    "polars",
    "mypy",
    "uv"
]

[project.urls]
Homepage = "https://stoupy51.github.io/stouputils"
Issues = "https://github.com/Stoupy51/stouputils/issues"
Repository = "https://github.com/Stoupy51/stouputils"

[project.scripts]
stouputils = "stouputils.__main__:main"

# Makes the VS Code palettes resolvable by name from any pygments consumer, not just the Sphinx generator
[project.entry-points."pygments.styles"]
vscode-dark-plus = "stouputils.applications.automatic_docs.sphinx.highlighting.styles:VSCodeDarkPlusStyle"
vscode-light-plus = "stouputils.applications.automatic_docs.sphinx.highlighting.styles:VSCodeLightPlusStyle"

[dependency-groups]
dev = [
    "pyrefly",
    "pyright",
    "ruff",
    "uv",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "*.pyi",
]
line-length = 200

[tool.ruff.lint.isort]
# Keeps the "name as name" re-exports of a package grouped in a single statement
combine-as-imports = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "T20",
    "RUF",
]
ignore = [
    "T201",
    "W191",
    "N803",
    "N806",
    "F403",
    "F405",
]

